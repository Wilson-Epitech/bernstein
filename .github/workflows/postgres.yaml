name: postgres-actions

on:
  push:
    branches: [ "main", "dev", "wilson/dev" ]
  pull_request:
    branches: [ "main", "dev", "wilson/dev" ]

jobs:
  postgres-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
    - uses: actions/checkout@v4

    - name: install K8s & K3d
      run: |
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/
        curl -s https://raw.githubusercontent.com/rancher/k3d/main/install.sh | bash

    - name: create K3d cluster
      run: |
        k3d cluster create --config ./.github/workflows/cluster.yaml
        kubectl cluster-info

    - name: postgres deployment
      run: |
        kubectl apply -f postgres.configmap.yaml
        kubectl apply -f postgres.secret.yaml
        kubectl apply -f postgres.volume.yaml
        kubectl apply -f postgres.volume.claim.yaml
        kubectl apply -f postgres.deployment.yaml
        kubectl apply -f postgres.service.yaml

    - name: wait for pod
      run: |
        while true; do
          pod_status=$(kubectl get pods -l app=postgres --no-headers | awk '{print $3}' || echo "Pending")
          if [ "$pod_status" == "Running" ]; then
            echo "Pod is running"
            break
          else
            echo "pod status: $pod_status"
            sleep 1
          fi
        done

    - name: pod test
      run: |
        pod_name=$(kubectl get pods -l app=postgres --no-headers | awk '{print $1}')
        kubectl exec "$pod_name" -- /bin/bash -c "whoami"
